# CryptoBench — SonarQube project configuration stub
#
# Paired explicitly with a SonarQube version inside the Sonar Cryptography
# Plugin's documented compatible range (releases of the plugin from 1.3.7
# onward require SonarQube 9.9 LTS or later; 10.5.0 and above is documented
# to break the plugin's cryptography rules). The exact SonarQube and
# plugin versions actually installed are recorded in docs/ENVIRONMENT.md,
# not here, so there is a single source of truth for pinned versions.
#
# sonar.host.url and any authentication token are intentionally NOT set in
# this file and must never be committed to the repository. Set them as
# local environment variables or SonarQube Scanner CLI arguments instead.

sonar.projectKey=cryptobench-pilot
sonar.projectName=CryptoBench Pilot
sonar.sources=.
